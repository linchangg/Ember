[project]
name = "surface-v1-adapter"
version = "0.1.0"
description = "Research adapter for the surface_v1 fire engine. Not an application backend."
requires-python = ">=3.12"
dependencies = [
    # Same floor as engine/pyproject.toml. The research adapter does not import the engine package.
    "numpy>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["adapter/tests"]
