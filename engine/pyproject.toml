[project]
name = "emberline"
version = "0.1.0"
description = "Emberline wildfire replay engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=2.3.0",
  "cfgrib>=0.9.15.1",
  "h5netcdf>=1.8.1",
  "herbie-data>=2026.9.2",
  "httpx>=0.28.1",
  "matplotlib>=3.11.2",
  "netcdf4>=1.7.5.1.post1",
  "numpy>=2",
  "pandas>=3.1.0",
  "pillow>=10",
  "py3dep>=0.19.0",
  "pyarrow>=26.0.0",
  "pydantic>=2",
  "pyproj>=3.8.0",
  "pyyaml>=6.0.3",
  "rasterio>=1.5.2",
  "rioxarray>=0.23.0",
  "s3fs>=2026.9.0",
  "scipy>=1.18.1",
  "shapely>=2",
  "xarray>=2026.9.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emberline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
