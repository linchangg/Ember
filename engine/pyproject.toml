[project]
name = "emberline"
version = "0.1.0"
description = "Emberline wildfire replay engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2",
  "pillow>=10",
  "pydantic>=2",
  "shapely>=2",
  "scipy>=1.14,<2",
  "pyproj>=3.6,<4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emberline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
