name: Rust HazardModel integration
on:
  push:
    paths: ['engine/**', 'physics/surface_v1/**', 'web/src/contracts.ts', 'web/src/data/**', 'web/src/forecast/**', 'web/package*.json', 'web/e2e/**', 'web/playwright.config.ts', 'spec/00_contracts.md', 'tools/check_hazard_frontend*.mjs', 'tools/check_dashboard_source.mts', 'tools/check_dashboard_panels.mts', '.github/workflows/hazard-backend.yml']
  pull_request:
    paths: ['engine/**', 'physics/surface_v1/**', 'web/src/contracts.ts', 'web/src/data/**', 'web/src/forecast/**', 'web/package*.json', 'web/e2e/**', 'web/playwright.config.ts', 'spec/00_contracts.md', 'tools/check_hazard_frontend*.mjs', 'tools/check_dashboard_source.mts', 'tools/check_dashboard_panels.mts', '.github/workflows/hazard-backend.yml']
permissions:
  contents: read
jobs:
  fixture:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned tools and locked Python dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --project engine --locked
          rustup toolchain install 1.99.1 --profile minimal
      - name: Build native backend
        run: cargo build --manifest-path physics/surface_v1/Cargo.toml -p fire-bridge --release --locked
      - name: Frozen API and all Python tests
        run: |
          uv run --project engine python -m ember.hazard.compatibility
          uv run --project engine pytest engine/tests
      - name: Complete synthetic fixture and frontend decoder
        run: |
          node --test tools/check_hazard_frontend.test.mjs
          uv run --project engine python -m ember.scripts.make_fixture
          uv run --project engine python -m ember.hazard.demo --out "$RUNNER_TEMP/rust-hazard-demo" --members 16 --report-branch
          node tools/check_hazard_frontend.mjs "$RUNNER_TEMP/rust-hazard-demo"
          npm --prefix web ci --ignore-scripts
          EMBER_FIXTURE_DIR="$RUNNER_TEMP/rust-hazard-demo" EMBER_SCENARIO_ID=rust-fixture npm --prefix web test
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npm --prefix web exec -- playwright install --with-deps chromium
            EMBER_FIXTURE_DIR="$RUNNER_TEMP/rust-hazard-demo" EMBER_SCENARIO_ID=rust-fixture npm --prefix web run test:browser
          fi
          uv run --project engine python -m ember.hazard.fixture_server --root "$RUNNER_TEMP/rust-hazard-demo" --port 8790 > "$RUNNER_TEMP/fixture-host.log" 2>&1 &
          FIXTURE_HOST_PID=$!
          trap 'kill "$FIXTURE_HOST_PID" 2>/dev/null || true' EXIT
          node tools/check_dashboard_source.mts http://127.0.0.1:8790/ rust-fixture
          node tools/check_dashboard_panels.mts http://127.0.0.1:8790/ rust-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-hazard-demo-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rust-hazard-demo/verification.json
            ${{ runner.temp }}/rust-hazard-demo/branches.json
            web/playwright-report/
            web/test-results/
