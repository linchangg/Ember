name: Deploy the dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario the site opens by default (eaton = the real backtest, fixture = synthetic)
        default: eaton
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      # Precomputed Eaton replay (all branches, call cards, lead times): too big for git, kept as a release asset.
      - name: Fetch the Eaton demo data
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download demo-data-eaton-v1 --pattern eaton-demo-data.tar.gz
          tar xzf eaton-demo-data.tar.gz
          ls cache/eaton
      - run: npm run build:pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SCENARIO_ID: ${{ inputs.scenario || 'eaton' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
